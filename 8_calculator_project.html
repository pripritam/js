
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>

    <link rel="stylesheet" href="8_calculator_project.css">
</head>

<body>

    <div class="calculator">

        <!-- Display -->
        <input type="text" class="display" readonly><!-- readonly means you can not write anything indide box when js use js can control-->

        <!-- Buttons -->
        <div class="buttons">

        

    <button class="operator" onclick="clearDisplay()">AC</button>
    <button class="operator" onclick="deleteLast()">DEL</button>
    <button class="operator" onclick="addToDisplay('%')">%</button>
    <button class="operator" onclick="addToDisplay('/')">÷</button>

    <button onclick="addToDisplay('7')">7</button>
    <button onclick="addToDisplay('8')">8</button>
    <button onclick="addToDisplay('9')">9</button>
    <button class="operator" onclick="addToDisplay('*')">×</button>

    <button onclick="addToDisplay('4')">4</button>
    <button onclick="addToDisplay('5')">5</button>
    <button onclick="addToDisplay('6')">6</button>
    <button class="operator" onclick="addToDisplay('-')">−</button>

    <button onclick="addToDisplay('1')">1</button>
    <button onclick="addToDisplay('2')">2</button>
    <button onclick="addToDisplay('3')">3</button>
    <button class="operator" onclick="addToDisplay('+')">+</button>

    <button onclick="addToDisplay('0')">0</button>
    <button onclick="addToDisplay('00')">00</button>
    <button onclick="addToDisplay('.')">.</button>
    <button class="equal" onclick="calculate()">=</button>

</div>
        </div>

   



    <script src="8_calculator_project.js">
        
    </script>

    
</body>
</html>
