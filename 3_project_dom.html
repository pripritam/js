                              //  String(25);//convert value to a string

            function handlecostkeydown(){
                if(event.key==='Enter'){
                calculatetotal();
        }

            }




        function calculatetotal(){
        const inputelement=    document.querySelector('.js-cost-input');
        let cost=Number(inputelement.value );//without using 'Number' it acct as string       // value enter in side placeholder like innerhtml
        if(cost<40){
            cost+=10;
        }
        document.querySelector('.js-total-cost')
        .innerHTML='$'+cost

        }



        




    function subscribe(){
            const button=document.querySelector('.sub-button');

            if(button.innerText==='subscribe'){  ////like innerhtml but innertext ignore spaces onlt take text
            button.innerHTML='subscribed'
            }
            else{
            button.innerHTML='subscribe'
}
    }
